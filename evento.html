<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F3F1EC">
<title>Captação de lead — Grupo Raion</title>
<!--
  Formulario de captacao em evento (Exapicor, Patio Petropolis, Festival Moto Brasil...): evento.html?e=<chave>.
  Config de cada evento: tabela eventos_captacao (Supabase), servida pela Edge Function lead-evento
  (fonte: python_leads/integracao/lead_evento/index.ts). Visual no molde do consorcio.raion.app.br (16/10/2026):
  papel creme, Barlow + Figtree, Marca em cartoes com o logo oficial (marcas/*.png) e a cor da marca escolhida.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F3F1EC; --card:#FFFFFF; --ink:#17181B; --txt2:#3E424A; --mut:#5B5F68; --line:#D5D0C7; --line2:#E2DED6;
    --ac:#17181B; --ac2:#B3261E; --ok:#1F7A45;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--ink);
    font:16px/1.5 "Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
    padding:14px 16px calc(40px + env(safe-area-inset-bottom));
    -webkit-text-size-adjust:100%;
  }
  button,input,select{font:inherit;color:inherit}
  .wrap{max-width:28rem;margin:0 auto}

  /* cabeçalho: faixa listrada na cor da marca + chip com o logo */
  .faixa{height:6px;border-radius:6px;background:var(--ac);position:relative;overflow:hidden;transition:background-color .35s}
  .faixa::before{content:"";position:absolute;inset:0 -40px;opacity:.35;
    background:repeating-linear-gradient(-55deg,var(--ac2) 0 10px,transparent 10px 24px);animation:listra 2.4s linear infinite}
  .cab{display:flex;align-items:center;gap:12px;margin-top:14px}
  .chip{flex-shrink:0;width:56px;height:56px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 0 1.5px var(--line2),0 3px 0 rgba(0,0,0,.08);transition:width .3s}
  .chip.largo{width:96px;border-radius:28px}
  .chip img{max-width:80%;max-height:74%;object-fit:contain;animation:pop .45s cubic-bezier(.3,1.5,.5,1)}
  .kicker{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ac);font-weight:700;transition:color .35s}
  h1{margin:0;font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:30px;line-height:1.02}
  .sub{margin:8px 0 2px;color:var(--txt2);font-size:15px}

  label{display:block;margin:16px 0 6px;font-size:14px;font-weight:600;color:var(--txt2)}
  .req::after{content:" *";color:var(--ac2)}
  input,select{
    width:100%;height:54px;padding:0 14px;border-radius:14px;border:1.5px solid var(--line);
    background:var(--card);font-size:17px;appearance:none;transition:border-color .2s,box-shadow .2s;
  }
  input:focus,select:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 16%,transparent)}
  select:disabled{opacity:.55}
  select{background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),
    linear-gradient(135deg,var(--mut) 50%,transparent 50%);
    background-position:calc(100% - 22px) 24px,calc(100% - 16px) 24px;
    background-size:6px 6px;background-repeat:no-repeat;padding-right:42px}

  /* marca em cartões com logo */
  .marcas{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:10px}
  .marcas button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
    height:92px;padding:10px 8px;border:1.5px solid var(--line);border-radius:16px;background:var(--card);cursor:pointer;
    font-size:13px;font-weight:700;color:var(--txt2);transition:border-color .2s,box-shadow .2s,transform .15s;
    opacity:0;transform:translateY(10px);animation:sobe .45s cubic-bezier(.2,.8,.3,1) forwards}
  .marcas button:nth-child(2){animation-delay:.06s}.marcas button:nth-child(3){animation-delay:.12s}
  .marcas button:nth-child(4){animation-delay:.18s}.marcas button:nth-child(5){animation-delay:.24s}
  .marcas button img{height:40px;max-width:84px;object-fit:contain}
  .marcas button:active{transform:scale(.97)}
  .marcas button.on{border:2px solid var(--cor);box-shadow:0 4px 0 var(--cor);color:var(--ink)}
  .marcas button.on::after{content:"✓";position:absolute;top:-8px;right:-8px;width:22px;height:22px;border-radius:50%;
    background:var(--cor);color:#fff;font-size:13px;line-height:22px;text-align:center;animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
  .sr{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}

  .primario{width:100%;height:56px;margin-top:24px;border:0;border-radius:14px;background:var(--ac);color:#fff;
    font-size:18px;font-weight:700;cursor:pointer;box-shadow:0 4px 0 color-mix(in srgb,var(--ac) 55%,#000);
    transition:background-color .35s,transform .15s}
  .primario:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--ac) 55%,#000)}
  .primario[disabled]{opacity:.6}
  .sec{width:100%;height:52px;margin-top:20px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);
    font-size:16px;font-weight:700;cursor:pointer}
  .aviso{margin-top:14px;padding:12px 14px;border-radius:14px;font-size:15px;display:none}
  .aviso.erro{background:#FBEDEC;border:1px solid #EBC6C2;color:#7A1A14;display:block}

  .centro{text-align:center;padding:40px 8px}
  .centro h2{margin:18px 0 4px;font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:36px;line-height:1.02}
  .centro p{color:var(--txt2);margin:6px 0 0}
  .circulo{width:88px;height:88px;margin:0 auto;border-radius:50%;background:var(--ac);display:flex;align-items:center;justify-content:center;
    transform:scale(0);animation:estoura .55s cubic-bezier(.3,1.6,.5,1) forwards}
  .circulo path{stroke-dasharray:24;stroke-dashoffset:24;animation:risca .45s .35s ease-out forwards}
  .id{font-size:13px;color:var(--mut);margin-top:18px}
  .raion{display:flex;justify-content:center;margin-top:28px}.raion img{width:108px;height:28px;object-fit:contain}
  .hide{display:none}

  .entra{opacity:0;transform:translateY(12px);animation:sobe .5s cubic-bezier(.2,.8,.3,1) forwards}
  @keyframes sobe{to{opacity:1;transform:none}}
  @keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
  @keyframes listra{to{background-position:84px 0}}
  @keyframes estoura{to{transform:scale(1)}}
  @keyframes risca{to{stroke-dashoffset:0}}
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}
    .entra,.marcas button{opacity:1;transform:none}.circulo{transform:none}.circulo path{stroke-dashoffset:0}}
</style>
</head>
<body>
<div class="wrap">

  <div id="carregando" class="centro"><p>Carregando o evento...</p></div>

  <div id="tela-form" class="hide">
    <div class="faixa"></div>
    <header class="cab">
      <div class="chip largo" id="chip"><img id="chip-img" src="logo-grupo-raion.png" alt="Grupo Raion"></div>
      <div>
        <div class="kicker" id="kicker">Grupo Raion</div>
        <h1 id="titulo"></h1>
      </div>
    </header>
    <div class="sub" id="subtitulo">Cadastro de cliente</div>

    <form id="f" autocomplete="on" novalidate>
      <label class="req" for="nome" id="lb-nome">Nome do cliente</label>
      <input id="nome" required autocomplete="name" enterkeyhint="next">

      <label class="req" for="telefone" id="lb-telefone">Telefone (WhatsApp)</label>
      <input id="telefone" required type="tel" inputmode="tel" autocomplete="tel"
             placeholder="(21) 99999-9999">

      <label for="email" id="lb-email">E-mail</label>
      <input id="email" type="email" inputmode="email" autocomplete="email">

      <div id="box-marca" class="hide">
        <label class="req">Marca</label>
        <div class="marcas" id="marcas-cards"></div>
        <select id="marca" class="sr" tabindex="-1" aria-hidden="true"></select>
      </div>

      <div id="box-loja" class="hide">
        <label class="req" for="loja">Loja</label>
        <select id="loja" required></select>
      </div>

      <label for="veiculo" id="lb-veiculo">Veículo de interesse</label>
      <select id="veiculo"></select>
      <input id="veiculo-outro" class="hide" placeholder="Qual veículo?" style="margin-top:8px">

      <div id="box-vendedor">
        <label for="vendedor">Vendedor que receberá a oportunidade</label>
        <select id="vendedor"></select>
      </div>

      <button id="btn" class="primario" type="submit">Enviar cadastro</button>
      <div class="aviso" id="erro"></div>
    </form>
    <div class="raion"><img src="logo-grupo-raion.png" alt="Grupo Raion"></div>
  </div>

  <div id="tela-ok" class="centro hide">
    <div class="circulo"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></div>
    <h2 id="ok-titulo">Cadastro enviado</h2>
    <p id="ok-nome"></p>
    <p id="ok-msg" class="hide"></p>
    <button id="novo" class="primario" type="button">Cadastrar outro cliente</button>
    <div class="id" id="ok-id"></div>
  </div>

  <div id="tela-erro" class="centro hide">
    <h2 id="erro-titulo">Link inválido</h2>
    <p id="erro-msg"></p>
  </div>

</div>

<script>
// Formulario de captacao em evento de rua (substitui o app do AppSheet).
// A configuracao do evento vem da Edge Function lead-evento; esta pagina e generica:
// evento novo = linha nova na tabela eventos_captacao, sem republicar o site.
var API = "https://winlvztcxczdgjqklxrv.supabase.co/functions/v1/lead-evento";

var $ = function (id) { return document.getElementById(id); };
var CHAVE = new URLSearchParams(location.search).get("e") || "";
var EV = null;

// marca (como vem da funcao) -> nome, logo oficial e cores (as mesmas do consorcio/pesquisa)
var MARCA_INFO = {
  "ROYAL ENFIELD": { nome: "Royal Enfield", logo: "marcas/royal.png",      cor: "#B3261E", cor2: "#F2B517" },
  "SYM":           { nome: "SYM",           logo: "marcas/sym.png",        cor: "#C4002B", cor2: "#FF5A6E", largo: true },
  "CF MOTO":       { nome: "CF Moto",       logo: "marcas/cfmoto.png",     cor: "#1D2125", cor2: "#8A939C" },
  "NISSAN":        { nome: "Nissan",        logo: "marcas/nissan.png",     cor: "#C3002F", cor2: "#8A939C" },
  "MITSUBISHI":    { nome: "Mitsubishi",    logo: "marcas/mitsubishi.png", cor: "#E60012", cor2: "#8A939C" },
  "ZEEKR":         { nome: "Zeekr",         logo: "zeekr-logo.svg",        cor: "#17181B", cor2: "#8A939C", largo: true }
};

function mostra(id) {
  ["carregando", "tela-form", "tela-ok", "tela-erro"].forEach(function (t) {
    $(t).classList.toggle("hide", t !== id);
  });
}

function falhaFatal(titulo, msg) {
  $("erro-titulo").textContent = titulo;
  $("erro-msg").textContent = msg;
  mostra("tela-erro");
}

// cor + logo do cabeçalho: a marca escolhida (ou a única do evento); sem marca = Grupo Raion
function aplicaMarca(m) {
  var info = MARCA_INFO[m];
  var raiz = document.documentElement.style;
  raiz.setProperty("--ac", info ? info.cor : "#17181B");
  raiz.setProperty("--ac2", info ? info.cor2 : "#B3261E");
  document.querySelector('meta[name="theme-color"]').content = info ? info.cor : "#F3F1EC";
  var img = $("chip-img"), novo = info ? info.logo : "logo-grupo-raion.png";
  if (img.getAttribute("src") !== novo) {
    var clone = img.cloneNode();                 // recria a <img> pra animação "pop" rodar de novo
    clone.src = novo; clone.alt = info ? info.nome : "Grupo Raion";
    img.parentNode.replaceChild(clone, img);
  }
  $("chip").classList.toggle("largo", !info || !!info.largo);
  $("kicker").textContent = info ? info.nome : "Grupo Raion";
}

function pintaVeiculos() {
  var loja = $("loja").value;
  var lista = (EV.modelos && EV.modelos[loja]) || [];
  var sel = $("veiculo");
  if (!loja) {
    sel.innerHTML = '<option value="">Escolha a loja primeiro</option>';
    sel.disabled = true;
  } else {
    var html = '<option value="">Selecione...</option>';
    lista.forEach(function (m) {
      html += '<option value="' + m.modelo.replace(/"/g, "&quot;") + '">' + m.rotulo + '</option>';
    });
    html += '<option value="__outro">Outro / não está na lista</option>';
    sel.innerHTML = html;
    sel.disabled = false;
  }
  $("veiculo-outro").classList.add("hide");
  $("veiculo-outro").value = "";
}

// "Outro" abre o campo livre — o vendedor nunca fica travado por falta de modelo na lista
$("veiculo").addEventListener("change", function () {
  var outro = $("veiculo").value === "__outro";
  $("veiculo-outro").classList.toggle("hide", !outro);
  if (outro) $("veiculo-outro").focus();
});

function pintaVendedores() {
  var loja = $("loja").value;
  // sem loja escolhida: com Marca na tela, só os vendedores das lojas daquela marca (nenhum antes da marca)
  var marca = MARCAS.length > 1 ? $("marca").value : "";
  var lista = EV.vendedores.filter(function (v) {
    if (loja) return !v.loja || v.loja === loja;
    if (MARCAS.length > 1) return !!marca && (EV.marcas || {})[v.loja] === marca;
    return true;
  });
  var html = '<option value="">Não informar</option>';
  lista.forEach(function (v) {
    html += '<option value="' + v.login + '">' + v.nome + '</option>';
  });
  $("vendedor").innerHTML = html;
}

// Dois jeitos de usar o mesmo formulario, decididos pela propria linha do evento:
//  - evento COM lista de vendedores  -> link da promotora: ela escolhe quem recebe o lead
//  - evento SEM lista (vendedores[]) -> link do QR: o cliente preenche sozinho, sem escolher
//    vendedor, e o lead cai na regua de distribuicao da loja.
var AUTO = false;

function textosDoCliente() {
  $("subtitulo").textContent = "Preencha seus dados e um consultor fala com você";
  $("lb-nome").textContent = "Seu nome";
  $("lb-telefone").textContent = "Seu telefone (WhatsApp)";
  $("lb-email").textContent = "Seu e-mail";
  $("lb-veiculo").textContent = "Qual modelo te interessa?";
  $("btn").textContent = "Quero falar com um consultor";
  $("box-vendedor").classList.add("hide");
  $("ok-titulo").textContent = "Cadastro enviado!";
  $("ok-msg").textContent = "Um consultor da Nissan Keiko vai falar com você. Boa feira!";
  $("ok-msg").classList.remove("hide");
  $("novo").classList.add("hide");
  $("ok-id").classList.add("hide");
}

function montaForm() {
  document.title = EV.nome + " — captação";
  $("titulo").textContent = EV.nome;
  AUTO = !EV.vendedores || EV.vendedores.length === 0;
  if (AUTO) textosDoCliente();

  var sel = $("loja");
  // evento com lojas de mais de uma marca (Festival 16/10): Marca vem antes, em cartões com logo, e filtra as lojas
  MARCAS = [];
  EV.lojas.forEach(function (l) {
    var m = (EV.marcas || {})[l];
    if (m && MARCAS.indexOf(m) < 0) MARCAS.push(m);
  });
  if (MARCAS.length > 1) {
    $("box-marca").classList.remove("hide");
    var hm = '<option value="">Selecione...</option>';
    MARCAS.forEach(function (m) { hm += '<option value="' + m + '">' + ((MARCA_INFO[m] || {}).nome || m) + '</option>'; });
    $("marca").innerHTML = hm;
    pintaCartoes();
    $("marca").addEventListener("change", function () {
      pintaCartoes(); aplicaMarca($("marca").value); pintaLojas(); pintaVeiculos(); pintaVendedores();
    });
  } else if (MARCAS.length === 1) {
    aplicaMarca(MARCAS[0]);                     // evento de uma marca só: já nasce com o logo e a cor dela
  }
  if (EV.lojas.length > 1) {
    $("box-loja").classList.remove("hide");
    pintaLojas();
  } else {
    sel.innerHTML = '<option value="' + EV.lojas[0] + '" selected>' + EV.lojas[0] + '</option>';
    sel.required = false;
  }
  sel.addEventListener("change", function () { pintaVeiculos(); pintaVendedores(); });
  pintaVeiculos();
  pintaVendedores();
  mostra("tela-form");
}

var MARCAS = [];

function pintaCartoes() {
  var atual = $("marca").value;
  $("marcas-cards").innerHTML = MARCAS.map(function (m) {
    var info = MARCA_INFO[m] || { nome: m, cor: "#17181B" };
    return '<button type="button" data-marca="' + m + '" style="--cor:' + info.cor + '"' + (m === atual ? ' class="on" aria-pressed="true"' : ' aria-pressed="false"') + '>' +
      (info.logo ? '<img src="' + info.logo + '" alt="">' : "") + '<span>' + info.nome + '</span></button>';
  }).join("");
}
$("marcas-cards").addEventListener("click", function (e) {
  var b = e.target.closest("button[data-marca]");
  if (!b || b.dataset.marca === $("marca").value) return;
  $("marca").value = b.dataset.marca;
  $("marca").dispatchEvent(new Event("change"));
});

// lojas do evento; com Marca na tela, só as da marca escolhida (marca com 1 loja já vem marcada)
function pintaLojas() {
  var sel = $("loja");
  if (EV.lojas.length < 2) return;
  var marca = MARCAS.length > 1 ? $("marca").value : "";
  if (MARCAS.length > 1 && !marca) {
    sel.innerHTML = '<option value="">Escolha a marca primeiro</option>';
    sel.disabled = true;
    return;
  }
  var lista = EV.lojas.filter(function (l) { return !marca || (EV.marcas || {})[l] === marca; });
  var html = lista.length > 1 ? '<option value="">Selecione...</option>' : "";
  lista.forEach(function (l) { html += '<option value="' + l + '">' + l + '</option>'; });
  sel.innerHTML = html;
  sel.disabled = false;
}

// ------------------------------------------------------------- carregar evento

if (!CHAVE) {
  falhaFatal("Link incompleto", "Esse link não diz de qual evento é. Peça o link certo pro marketing.");
} else {
  fetch(API + "?e=" + encodeURIComponent(CHAVE))
    .then(function (r) { return r.json(); })
    .then(function (j) {
      if (!j.ok) {
        if (j.erro === "evento-encerrado") {
          falhaFatal("Evento encerrado", "Esse evento já foi fechado. Fale com o marketing.");
        } else {
          falhaFatal("Link inválido", "Esse evento não existe. Confira o link com o marketing.");
        }
        return;
      }
      EV = j.evento;
      montaForm();
    })
    .catch(function () {
      falhaFatal("Sem conexão", "Não deu pra carregar o evento. Confira o sinal e recarregue a página.");
    });
}

// -------------------------------------------------------------------- envio

function falta(msg, foco) {
  var erro = $("erro");
  erro.textContent = msg;
  erro.className = "aviso erro";
  if (foco) foco.focus();
}

$("f").addEventListener("submit", function (e) {
  e.preventDefault();
  var btn = $("btn"), erro = $("erro");
  erro.className = "aviso";
  // conferência na tela (o form é novalidate): sem loja, a função cairia na 1ª loja do evento — nunca deixar passar
  if (!$("nome").value.trim()) return falta("Preencha o nome.", $("nome"));
  if (!$("telefone").value.replace(/\D/g, "")) return falta("Preencha o telefone.", $("telefone"));
  if (MARCAS.length > 1 && !$("marca").value) return falta("Escolha a marca.");
  if (EV.lojas.length > 1 && !$("loja").value) return falta("Escolha a loja.", $("loja"));
  btn.disabled = true;
  btn.textContent = "Enviando...";

  fetch(API, {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({
      chave: EV.chave,
      nome: $("nome").value,
      telefone: $("telefone").value,
      email: $("email").value,
      veiculo: $("veiculo").value === "__outro" ? $("veiculo-outro").value : $("veiculo").value,
      loja: $("loja").value,
      vendedor: $("vendedor").value
    })
  })
    .then(function (r) { return r.json(); })
    .then(function (j) {
      if (!j.ok) throw new Error(j.erro || "não foi possível enviar");
      $("ok-nome").textContent = $("nome").value;
      $("ok-id").textContent = j.id_evento ? ("Syonet #" + j.id_evento) : "";
      // recria o círculo pra animação do check rodar a cada envio
      var c = document.querySelector("#tela-ok .circulo"); c.replaceWith(c.cloneNode(true));
      mostra("tela-ok");
      window.scrollTo(0, 0);
    })
    .catch(function (err) {
      erro.textContent = "Não enviou: " + err.message + ". Confira o sinal e tente de novo.";
      erro.className = "aviso erro";
    })
    .then(function () {
      btn.disabled = false;
      btn.textContent = AUTO ? "Quero falar com um consultor" : "Enviar cadastro";
    });
});

$("novo").addEventListener("click", function () {
  $("f").reset();
  if (EV.lojas.length === 1) $("loja").value = EV.lojas[0];
  if (MARCAS.length > 1) { pintaCartoes(); aplicaMarca(""); }
  pintaLojas();
  pintaVeiculos();
  pintaVendedores();
  $("erro").className = "aviso";
