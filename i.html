<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F3F1EC">
<title>Você foi indicado · Royal Enfield</title>
<meta property="og:title" content="Um amigo te indicou pra Royal Enfield">
<meta property="og:description" content="Toque pra falar com a loja pelo WhatsApp.">
<meta property="og:image" content="https://raion.app.br/og_indicacao.jpg">
<meta property="og:type" content="website">
<!--
  Pagina do AMIGO no programa de indicacao da pesquisa de moto (Royal). O cliente que deu tudo 9-10 manda o link
  pelo celular dele; aqui o amigo ve quem indicou e chama o BDC Motos (caixa 135) ja com o codigo na mensagem.
  Regra: python_leads/docs/indicacao_pesquisa_moto.md. TESTE: nome/loja vem na URL (?c=&n=&l=); no programa de
  verdade o codigo resolve nome e loja pela Edge Function e o link vira raion.app.br/i/<codigo>.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F1EC;--card:#FFFFFF;--ink:#17181B;--txt2:#3E424A;--mut:#5B5F68;--line2:#E2DED6;--accent:#B3261E;--pe:calc(env(safe-area-inset-bottom) + 40px)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-text-size-adjust:100%}
body{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
.app{flex:1 0 auto;width:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;padding:14px 24px 4px}
.topo{display:flex;align-items:center;justify-content:center;min-height:44px}
.topo img{width:54px;height:54px;object-fit:contain}
.selo{margin:26px 0 0;text-align:center;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);opacity:0;animation:sobe .5s .1s forwards}
h1{margin:8px 0 0;text-align:center;font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:600;font-size:42px;line-height:1.02;opacity:0;animation:sobe .5s .25s forwards}
.txt{margin:14px 0 0;text-align:center;font-size:17px;line-height:1.5;color:var(--txt2);opacity:0;animation:sobe .5s .4s forwards}
.cresce{flex-grow:1;min-height:20px}
.zap{display:flex;align-items:center;justify-content:center;gap:10px;height:56px;border-radius:14px;background:#128C4B;color:#fff;font-size:18px;font-weight:700;text-decoration:none;opacity:0;animation:sobe .5s .6s forwards}
.miudo{margin:10px 0 0;text-align:center;font-size:13px;color:var(--mut);opacity:0;animation:sobe .5s .7s forwards}
@keyframes sobe{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
/* moto a nanquim, mesma da pesquisa (rodas giram) */
.palco{position:relative;flex-shrink:0;width:100%;height:calc(184px + var(--pe));overflow:hidden;pointer-events:none}
.chao{position:absolute;left:0;right:0;bottom:calc(20px + var(--pe));height:3px;background:repeating-linear-gradient(90deg,#17181B 0 22px,transparent 22px 40px);opacity:.28;animation:corre .5s linear infinite}
.piloto{position:absolute;left:50%;bottom:calc(21px + var(--pe));width:220px;margin-left:-110px;animation:quica .42s ease-in-out infinite}
.moto{position:relative;width:100%;aspect-ratio:1230/913}
.moto img{position:absolute;display:block}
.moto .corpo{inset:0;width:100%;height:100%;animation:motor .09s steps(2) infinite}
.moto .roda{aspect-ratio:1;animation:gira .9s linear infinite}
@keyframes corre{to{background-position:-40px 0}}
@keyframes quica{50%{transform:translateY(-2px)}}
@keyframes motor{50%{transform:translate(.6px,-.6px)}}
@keyframes gira{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}
</style>
</head>
<body>
<main class="app">
  <header class="topo"><img src="marcas/royal.png" alt="Royal Enfield"></header>
  <p class="selo">Convite de amigo</p>
  <h1 id="titulo">Um amigo te indicou pra Royal Enfield</h1>
  <p class="txt" id="texto">Chama a gente no WhatsApp: a equipe te apresenta as motos, tira suas dúvidas e marca um test ride sem compromisso.</p>
  <div class="cresce"></div>
  <a class="zap" id="zap" href="#" rel="noopener">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.8 11.9 11.9 0 0 0 4.6 4c1.7.7 2.4.8 3.2.7a2.8 2.8 0 0 0 1.8-1.3 2.3 2.3 0 0 0 .2-1.3c-.1-.1-.3-.2-.5-.3z"/></svg>
    Falar com a loja
  </a>
  <p class="miudo" id="miudo">Atendimento pelo WhatsApp da Royal Enfield · Grupo Raion</p>
</main>
<div class="palco" aria-hidden="true"><div class="chao"></div><div class="piloto"><div class="moto">
  <img class="roda" src="roda_classica.webp" alt="" style="left:1.22%;top:59.91%;width:28.94%">
  <img class="roda" src="roda_classica.webp" alt="" style="left:70.24%;top:59.91%;width:29.27%">
  <img class="corpo" src="moto_classica_corpo.webp" alt="">
</div></div></div>
<script>
(function () {
  var BDC_MOTOS_WA = "552134005901";            // WhatsApp do BDC Motos (caixa 135 da OpenBox)
  var q = new URLSearchParams(location.search);
  var codigo = (q.get("c") || "").replace(/[^A-Za-z0-9-]/g, "").slice(0, 12);
  var nome = (q.get("n") || "").replace(/[<>]/g, "").slice(0, 30).trim();
  var loja = (q.get("l") || "").replace(/[<>]/g, "").slice(0, 40).trim();
  var primeiro = nome.split(/\s+/)[0];
  if (primeiro) document.getElementById("titulo").textContent = primeiro + " te indicou pra Royal Enfield" + (loja ? " " + loja : "");
  var msg = "Oi! Vim pela indicação" + (primeiro ? " de " + primeiro : "") + (codigo ? " (" + codigo + ")" : "") + ". Quero conhecer as motos da Royal Enfield.";
  document.getElementById("zap").href = "https://wa.me/" + BDC_MOTOS_WA + "?text=" + encodeURIComponent(msg);
})();
</script>
</body>
</html>
