:root{--bg:#f4f4f5;--card:#fff;--tx:#18181b;--mut:#71717a;--bd:#e4e4e7;--red:#e11d2e;--zap:#1fa855;--warn:#b45309;--warnbg:#fef3c7}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.5 "Segoe UI",system-ui,-apple-system,sans-serif}
.wrap{max-width:520px;margin:0 auto;padding:16px 16px 48px}
header{display:flex;align-items:center;gap:12px;margin:4px 0 14px}
header img{height:34px}
h1{font-size:22px;line-height:1.2;margin:0;font-weight:800}
.sub{color:var(--mut);font-size:14px}
.proto{background:var(--warnbg);color:var(--warn);font-size:13.5px;border-radius:10px;padding:8px 12px;margin-bottom:14px}
.tabs{display:flex;gap:6px;background:#e4e4e7;border-radius:12px;padding:4px;margin-bottom:14px}
.tabs button{flex:1;border:0;background:transparent;font:600 15px "Segoe UI",system-ui,sans-serif;padding:9px;border-radius:9px;color:var(--mut);cursor:pointer}
.tabs button.on{background:#fff;color:var(--tx);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.lista{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.visita{background:var(--card);border:2px solid var(--bd);border-radius:14px;padding:12px 14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;font:inherit;color:inherit;width:100%}
.visita.on{border-color:var(--red)}
.visita b{font-size:18px}
.visita .q{color:var(--mut);font-size:14.5px}
.hora{font-weight:800;font-size:18px;white-space:nowrap}
.semhora{color:var(--mut);font-size:13.5px;white-space:nowrap}
.painel{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px}
.campo{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.campo label{font-size:13.5px;color:var(--mut);font-weight:600}
.campo input{font:inherit;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:#fff;color:var(--tx);width:100%}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
/* iPhone: data/hora têm largura mínima própria e estouram a coluna */
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;min-width:0;max-width:100%;min-height:46px;display:block;text-align:left}
input::-webkit-date-and-time-value{text-align:left}
.pede{background:var(--warnbg);border-radius:12px;padding:10px 12px;margin-bottom:12px}
.pede p{margin:0 0 6px;font-size:15px;color:var(--warn);font-weight:600}
#prev{width:100%;border-radius:12px;display:block;background:#111;aspect-ratio:4/5}
.acoes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.btn{border:0;border-radius:12px;padding:13px 10px;font:700 16px "Segoe UI",system-ui,sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn img{width:22px;height:22px}
.salvar{background:var(--tx);color:#fff}
.zap{background:var(--zap);color:#fff}
.btn[aria-disabled="true"]{opacity:.35;pointer-events:none}
.msg{margin-top:12px;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:12px;padding:10px 12px;font-size:14.5px;white-space:pre-wrap;overflow-wrap:anywhere;color:#14532d}
.msg small{display:block;color:var(--mut);font-weight:600;margin-bottom:4px}
.hide{display:none}
</style>
</head>

const dt = iso => { const [y,m,d] = iso.split("-").map(Number); return new Date(y, m-1, d); };
const diaCurto = iso => { const d = dt(iso); return SEM[d.getDay()] + ", " + String(d.getDate()).padStart(2,"0") + "/" + String(d.getMonth()+1).padStart(2,"0"); };
const diaLongo = iso => { const d = dt(iso); return SEM[d.getDay()] + ", " + d.getDate() + " de " + MES[d.getMonth()]; };
const horaTx = h => { if (!h) return ""; const [H,M] = h.split(":"); return M === "00" ? Number(H) + "h" : Number(H) + "h" + M; };
const relativo = iso => { const dd = Math.round((dt(iso) - dt(HOJE)) / 864e5); return dd === 0 ? "hoje" : dd === 1 ? "amanhã" : ""; };

const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
const imgFoto = document.getElementById("imgFoto"), imgLogo = document.getElementById("imgLogo");
const RED = "#C3002F";

function ajusta(txt, peso, max, larg) {
  let t = max;
  do { ctx.font = `${peso} ${t}px NissanBrand`; t -= 2; } while (ctx.measureText(txt).width > larg && t > 30);
  return ctx.font;
}

function desenha(v) {
  const W = 1080, H = 1350, M = 72;
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = "#0f0f10"; ctx.fillRect(0, 0, W, H);
  ctx.drawImage(imgFoto, 0, 0, 1080, 760);
  let g = ctx.createLinearGradient(0, 0, 0, 220);
  g.addColorStop(0, "rgba(0,0,0,.62)"); g.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, 220);
  g = ctx.createLinearGradient(0, 470, 0, 760);
  g.addColorStop(0, "rgba(15,15,16,0)"); g.addColorStop(1, "rgba(15,15,16,1)");
  ctx.fillStyle = g; ctx.fillRect(0, 470, W, 290);
  const lw = 300, lh = lw * imgLogo.naturalHeight / imgLogo.naturalWidth;
  ctx.drawImage(imgLogo, M - 6, 48, lw, lh);

  // sem hora: a linha da hora some e o bloco de cima desce pra fechar o buraco
  const h = horaTx(v.hora), dy = h ? 0 : 68;
  // selo
  ctx.font = "700 30px NissanBrand";
  const selo = h ? "SEU HORÁRIO ESTÁ RESERVADO" : "SUA VISITA ESTÁ RESERVADA";
  ctx.letterSpacing = "3px";
  const sw = ctx.measureText(selo).width + 48;
  ctx.fillStyle = RED; ctx.fillRect(M, 700 + dy, sw, 62);
  ctx.fillStyle = "#fff"; ctx.textBaseline = "middle"; ctx.fillText(selo, M + 24, 732 + dy);
  ctx.letterSpacing = "0px";

  ctx.textBaseline = "alphabetic";
  const nome = nomeBonito(v.cliente) || "Seu nome";
  ctx.font = ajusta(nome + ",", 700, 118, W - 2 * M);
  ctx.fillStyle = "#fff"; ctx.fillText(nome + ",", M, 898 + dy);

  ctx.font = "300 54px NissanBrand"; ctx.fillStyle = "#e4e4e7";
  ctx.fillText(v.dia ? diaLongo(v.dia) : "dia da visita", M, 982 + dy);
  if (h) { ctx.font = "700 54px NissanBrand"; ctx.fillStyle = "#fff"; ctx.fillText("às " + h, M, 1050); }

  ctx.font = "400 38px NissanBrand"; ctx.fillStyle = "#a1a1aa";
  const qr = "Quem vai te receber: ";
  ctx.fillText(qr, M, 1120);
  const qw = ctx.measureText(qr).width;
  ctx.font = "700 38px NissanBrand"; ctx.fillStyle = "#fff";
  ctx.fillText(nomeBonito(v.vend) || "—", M + qw, 1120);
  ctx.font = "700 34px NissanBrand"; ctx.fillStyle = "#ff4d6a";
  ctx.fillText("E tem uma surpresa te esperando.", M, 1174);

  ctx.fillStyle = "#2a2a2d"; ctx.fillRect(M, 1210, W - 2 * M, 2);
  // pino
  ctx.fillStyle = RED; ctx.beginPath();
  ctx.arc(M + 16, 1258, 16, Math.PI, 0); ctx.lineTo(M + 16, 1292); ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#0f0f10"; ctx.beginPath(); ctx.arc(M + 16, 1258, 6, 0, 2 * Math.PI); ctx.fill();
  ctx.font = "700 32px NissanBrand"; ctx.fillStyle = "#fff"; ctx.fillText(LOJA.rua, M + 50, 1266);
  ctx.font = "400 28px NissanBrand"; ctx.fillStyle = "#a1a1aa"; ctx.fillText(LOJA.bairro, M + 50, 1304);
  return cv.toDataURL("image/png");
}

// DDD + celular (10 ou 11 dígitos) vira 55DDDNNNNNNNNN; já com 55 passa direto; qualquer outra coisa = sem número
const zapNumero = t => { const d = (t || "").replace(/\D/g, ""); return d.length === 10 || d.length === 11 ? "55" + d : (d.length >= 12 && d.startsWith("55") ? d : ""); };

function mensagem(v) {
  const nome = nomeBonito(v.cliente), vend = nomeBonito(v.vend);
  const rel = relativo(v.dia), quando = (rel ? rel + ", " : "") + diaCurto(v.dia) + (v.hora ? ", às " + horaTx(v.hora) : "");
  // artigo vem do sexo no RH (como no Prospecta); na arte avulsa não tem RH, vai sem artigo
  const quem = vend ? (v.art ? v.art + " " : "") + vend : "a equipe";
  return `Oi, ${nome}! Aqui é ${quem}, da ${LOJA.nome}.\n\n` +
    `${v.hora ? "Seu horário está reservado" : "Sua visita está reservada"}: ${quando}. Preparamos uma surpresa pro seu atendimento.\n\n` +
    `Confirma sua presença? É só responder CONFIRMADO.\n\nComo chegar: ${LOJA.maps}`;
}

let atual = null, pngAtual = null;
const prev = document.getElementById("prev"), bSalvar = document.getElementById("bSalvar"), bZap = document.getElementById("bZap");
const pede = document.getElementById("pede"), pHora = document.getElementById("pHora"), msgTx = document.getElementById("msgTx");

function render() {
  const v = atual; if (!v) return;
  pngAtual = desenha(v); prev.src = pngAtual;
  const pronto = !!(v.cliente && v.dia);
  bSalvar.setAttribute("aria-disabled", String(!pronto));
  bZap.setAttribute("aria-disabled", String(!pronto));
  const tx = mensagem(v); msgTx.textContent = tx;
  // com número abre a conversa do cliente; sem número o WhatsApp pede pra escolher o contato
  bZap.href = "https://wa.me/" + zapNumero(v.tel) + "?text=" + encodeURIComponent(tx);
  const nomeArq = "visita_" + (nomeBonito(v.cliente) || "cliente").normalize("NFD").replace(/[^\w]/g, "") + "_" + (v.dia || "") + ".png";
  bSalvar.download = nomeArq; bSalvar.href = pngAtual; bSalvar.dataset.nome = nomeArq;
}

// iPhone: folha de compartilhar ("Salvar imagem" vai pras Fotos); resto: download normal
bSalvar.addEventListener("click", async e => {
  if (!/iPhone|iPad|iPod/.test(navigator.userAgent) || !navigator.canShare) return;
  const blob = await (await fetch(pngAtual)).blob();
  const file = new File([blob], bSalvar.dataset.nome, {type: "image/png"});
  if (navigator.canShare({files: [file]})) { e.preventDefault(); try { await navigator.share({files: [file]}); } catch (_) {} }
});

function lista() {
  const el = document.getElementById("lista"); el.innerHTML = "";
  VISITAS.forEach((v, i) => {
    const b = document.createElement("button"); b.className = "visita" + (atual === v ? " on" : "");
    const rel = relativo(v.dia);
    b.innerHTML = `<div><b>${nomeBonito(v.cliente)}</b><div class="q">${rel ? rel + " · " : ""}${diaCurto(v.dia)} · com ${nomeBonito(v.vend)}</div></div>` +
      (v.hora ? `<span class="hora">${horaTx(v.hora)}</span>` : `<span class="semhora">sem hora</span>`);
    b.onclick = () => escolhe(v); el.appendChild(b);
  });
}

function escolhe(v) {
  atual = v; lista();
  pede.classList.toggle("hide", !(v._semHora));
  pHora.value = v.hora || "";
  render();
}
VISITAS.forEach(v => v._semHora = !v.hora);
pHora.addEventListener("input", () => { if (atual) { atual.hora = pHora.value; render(); lista(); } });

// arte avulsa
const man = {cliente: "", dia: "", hora: "", vend: "", tel: ""};
const mN = document.getElementById("mNome"), mD = document.getElementById("mDia"), mH = document.getElementById("mHora"), mV = document.getElementById("mVend"), mT = document.getElementById("mTel");
mD.value = maisDias(HOJE, 1);
[mN, mD, mH, mV, mT].forEach(i => i.addEventListener("input", () => {
  man.cliente = mN.value; man.dia = mD.value; man.hora = mH.value; man.vend = mV.value; man.tel = mT.value; atual = man; render();
}));
man.dia = mD.value;

const tVis = document.getElementById("tVis"), tMan = document.getElementById("tMan");
tVis.onclick = () => { tVis.classList.add("on"); tMan.classList.remove("on"); secVis.classList.remove("hide"); secMan.classList.add("hide"); escolhe(VISITAS.find(v => v.hora) || VISITAS[0]); };
tMan.onclick = () => { tMan.classList.add("on"); tVis.classList.remove("on"); secMan.classList.remove("hide"); secVis.classList.add("hide"); pede.classList.add("hide"); atual = man; render(); };

Promise.all([
  document.fonts.load("700 40px NissanBrand"), document.fonts.load("400 40px NissanBrand"), document.fonts.load("300 40px NissanBrand"),
  imgFoto.decode(), imgLogo.decode()
]).then(() => escolhe(VISITAS.find(v => v.hora) || VISITAS[0]));
</script>
