<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Pesquisa de Satisfação — Zeekr</title>
<style>
  /* tipografia oficial, mesmo par do site zeekrlife.com:
     ZeekrHeadline nos titulos, ZeekrText no corpo (woff2 do proprio site) */
  @font-face{font-family:'ZeekrHeadline';src:url('fonts/ZeekrHeadline-Regular.woff2') format('woff2');
    font-display:swap}
  @font-face{font-family:'ZeekrText';src:url('fonts/ZeekrText-Regular.woff2') format('woff2'),
    url('fonts/ZeekrText-Regular.ttf') format('truetype');
    font-weight:400;font-style:normal;font-display:swap}
  @font-face{font-family:'ZeekrText';src:url('fonts/ZeekrText-Medium.woff2') format('woff2'),
    url('fonts/ZeekrText-Medium.ttf') format('truetype');
    font-weight:500 600;font-style:normal;font-display:swap}
  @font-face{font-family:'ZeekrText';src:url('fonts/ZeekrText-Bold.ttf') format('truetype');
    font-weight:700 900;font-style:normal;font-display:swap}
  /* paleta na pegada Zeekr: preto profundo, branco quente, laranja de acento */
  :root{
    --bg:#0a0a0a; --card:#141414; --line:#2a2a2a;
    --txt:#f4f4f2; --dim:#9a9a94; --ac:#ff6e00; --ok:#22c55e; --warn:#f59e0b;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--txt);
    font:15px/1.5 "ZeekrHeadline","ZeekrText",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    padding:28px 24px 60px;
  }
  .wrap{max-width:74rem;margin:0 auto}
  .estreito{max-width:26rem;margin:0 auto}
  header{margin:0 0 22px}
  .kicker{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--ac);font-weight:700}
  h1,h2{font-family:'ZeekrHeadline','ZeekrText',sans-serif;font-weight:400}
  h1{font-size:26px;margin:6px 0 2px;line-height:1.2}
  .logo{height:22px;filter:invert(1);display:block;margin-bottom:10px}
  .sub{color:var(--dim);font-size:14px}
  label{display:block;margin:14px 0 6px;font-size:14px;color:var(--dim)}
  input,textarea{
    width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);
    background:var(--card);color:var(--txt);font-size:16px;appearance:none;
  }
  textarea{min-height:88px;resize:vertical;font-family:inherit}
  input:focus,textarea:focus{outline:2px solid var(--ac);outline-offset:1px}
  button{border:0;border-radius:12px;cursor:pointer;font-weight:700;font-family:inherit}
  input,textarea{font-family:inherit}
  .btn-cheio{width:100%;margin-top:16px;padding:14px;background:var(--ac);color:#0a0a0a;font-size:16px}
  .btn-fantasma{width:100%;margin-top:10px;padding:12px;background:var(--card);
    border:1px solid var(--line);color:var(--dim);font-size:14px}
  button[disabled]{opacity:.55}
  .aviso{margin-top:14px;padding:12px;border-radius:10px;font-size:14px;display:none}
  .aviso.erro{background:#2a1216;border:1px solid #5b1d25;color:#ffc9d0;display:block}
  .centro{text-align:center;padding:40px 8px}
  .centro p{color:var(--dim)}
  .hide{display:none}

  .badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.08em;
    padding:3px 9px;border-radius:99px;text-transform:uppercase}
  .badge.compra{background:#2a1602;color:#ff8a3d;border:1px solid #5b3517}
  .badge.servico{background:#1c1c1c;color:#c9c9c4;border:1px solid #3a3a3a}
  .venc{font-size:12px;color:var(--dim)}
  .venc.atrasada{color:var(--warn)}
  .tel{color:var(--ok);text-decoration:none;font-weight:700}

  /* lista em linhas largas (desktop) */
  .cab, .linha{
    display:grid;gap:16px;align-items:center;
    grid-template-columns:110px 1.1fr 1fr 1.6fr 150px;
  }
  .cab{padding:0 16px;margin:18px 0 6px;color:var(--dim);font-size:12px;
    text-transform:uppercase;letter-spacing:.08em}
  .linha{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:14px 16px;margin:8px 0;cursor:pointer;
  }
  .linha:hover{outline:2px solid var(--ac)}
  .linha h3{margin:0 0 2px;font-size:16px}
  .linha .mini{color:var(--dim);font-size:13px}
  .quem{color:var(--txt);font-size:14px}

  /* pesquisa aberta: dossie + formulario + CRM (historico de contato, estilo Syonet) */
  .duas{display:grid;grid-template-columns:320px 1fr 340px;gap:22px;align-items:start}
  @media (max-width:1150px){ .duas{grid-template-columns:320px 1fr} }
  @media (max-width:900px){ .duas{grid-template-columns:1fr} .cab{display:none}
    .linha{grid-template-columns:1fr;gap:6px} }
  .crm h3{margin:0 0 4px;font-size:15px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim)}
  .evt{border-left:3px solid var(--warn);background:var(--bg);border-radius:8px;
    padding:9px 12px;margin:10px 0}
  .evt .quando{font-size:12px;color:var(--dim)}
  .evt .texto{font-size:14px;margin-top:2px}
  .crm .nada{color:var(--dim);font-size:14px;margin:12px 0}
  .crm textarea{min-height:56px;margin-top:14px}
  .crm .btn-tentativa{width:100%;margin-top:10px;padding:12px;background:#241a06;
    border:1px solid #4a3812;color:var(--warn);font-size:14px;border-radius:12px}
  .crm .separa{border-top:1px solid var(--line);margin:18px 0 4px}
  .painel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
  .painel h2{margin:10px 0 2px;font-size:20px}
  .painel dl{margin:14px 0 0}
  .painel dt{color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.08em;margin-top:12px}
  .painel dd{margin:2px 0 0;font-size:15px;white-space:pre-line}
  .painel .tel{font-size:20px}

  .q{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:0 0 12px}
  .q .p{font-size:15px;margin:0 0 10px}
  .opcoes{display:flex;gap:6px;flex-wrap:wrap}
  .opcoes button{
    min-width:44px;padding:10px 14px;background:var(--bg);
    border:1px solid var(--line);color:var(--txt);font-size:15px;border-radius:10px;
  }
  .opcoes button.sel{background:var(--ac);border-color:var(--ac);color:#fff}
  .voltar{background:none;color:var(--dim);font-size:14px;padding:6px 0;margin-bottom:10px}
</style>
</head>
<body>
<div class="wrap">

  <!-- senha -->
  <div id="tela-senha" class="hide">
    <div class="estreito">
      <header>
        <img class="logo" src="zeekr-logo.svg" alt="ZEEKR">
        <div class="kicker">Grupo Raion</div>
        <h1>Pesquisa de Satisfação</h1>
        <div class="sub">Página de trabalho da equipe</div>
      </header>
      <form id="f-senha">
        <label for="senha">Senha de acesso</label>
        <input id="senha" type="password" autocomplete="current-password" required>
        <button class="btn-cheio" type="submit">Entrar</button>
        <div class="aviso" id="erro-senha"></div>
      </form>
    </div>
  </div>

  <div id="carregando" class="centro"><p>Carregando...</p></div>

  <!-- lista -->
  <div id="tela-lista" class="hide">
    <header>
      <img class="logo" src="zeekr-logo.svg" alt="ZEEKR">
      <div class="kicker">Grupo Raion</div>
      <h1>Pesquisas pendentes</h1>
      <div class="sub" id="resumo"></div>
    </header>
    <div class="cab">
      <div>Tipo</div><div>Cliente</div><div>Veículo</div>
      <div>O que foi feito / quem atendeu</div><div>Quando</div>
    </div>
    <div id="lista"></div>
    <div id="vazio" class="centro hide"><p>Nenhuma pesquisa pendente. 🎉</p></div>
    <button class="btn-fantasma" id="recarregar" type="button" style="max-width:16rem">Atualizar lista</button>
  </div>

  <!-- resultado (pos-conclusao) -->
  <div id="tela-resultado" class="hide">
    <div class="estreito">
      <div class="centro" style="padding-bottom:12px">
        <div style="font-size:48px;color:var(--ac)">&#10004;</div>
        <h1 style="font-size:20px">Pesquisa concluída</h1>
        <p class="sub" id="res-cliente"></p>
      </div>
      <div class="painel"><dl id="res-respostas" style="margin-top:0"></dl></div>
      <p class="sub centro" id="res-email" style="padding:10px 0 0"></p>
      <button class="btn-cheio" id="res-voltar" type="button">Voltar pra lista</button>
    </div>
  </div>

  <!-- pesquisa aberta -->
  <div id="tela-pesquisa" class="hide">
    <button class="voltar" id="voltar" type="button">&#8592; voltar pra lista</button>
    <div class="duas">
      <div class="painel">
        <div id="p-badge"></div>
        <h2 id="p-nome"></h2>
        <dl id="p-dossie"></dl>
      </div>
      <div>
        <div id="perguntas"></div>
        <label for="atendente">Quem está ligando (seu nome)</label>
        <input id="atendente" autocomplete="off" style="max-width:22rem">
        <div style="max-width:22rem">
          <button class="btn-cheio" id="concluir" type="button">Concluir pesquisa</button>
        </div>
        <div class="aviso" id="erro-resp"></div>
      </div>
      <div class="painel crm">
        <h3>Histórico de contato</h3>
        <div id="crm-timeline"></div>
        <textarea id="crm-obs" placeholder="Observação da ligação (opcional)"></textarea>
        <button class="btn-tentativa" id="tentar" type="button">📵 Não atendeu — registrar tentativa</button>
        <div class="separa"></div>
        <button class="btn-fantasma" id="sem-contato" type="button">Não consegui mais contato (desisto)</button>
        <button class="btn-fantasma" id="descartar" type="button">Descartar (não pesquisar)</button>
      </div>
    </div>
  </div>

</div>

<script>
// Pagina de trabalho da Pesquisa de Satisfacao Zeekr (fase 1: equipe liga e preenche).
// Desktop-first por decisao do Joao (26/08/2026): a pesquisa e feita no computador.
// Dados e perguntas vem da Edge Function pesquisa-zeekr, atras de senha; nada mora aqui.
// Quem alimenta as pendencias e o robo local pesquisa_zeekr.py (repo python_leads).
var API = "https://winlvztcxczdgjqklxrv.supabase.co/functions/v1/pesquisa-zeekr";

var $ = function (id) { return document.getElementById(id); };
var SENHA = localStorage.getItem("pz_senha") || "";
var DADOS = null;      // {pendentes, perguntas}
var ABERTA = null;     // pendencia aberta
var RESP = {};         // respostas da pesquisa aberta

function mostra(id) {
  ["tela-senha", "carregando", "tela-lista", "tela-pesquisa", "tela-resultado"].forEach(function (t) {
    $(t).classList.toggle("hide", t !== id);
  });
}

function api(payload, cb) {
  var x = new XMLHttpRequest();
  x.open("POST", API);
  x.setRequestHeader("Content-Type", "application/json");
  x.onload = function () {
    var b = {};
    try { b = JSON.parse(x.responseText); } catch (e) {}
    cb(x.status, b);
  };
  x.onerror = function () { cb(0, {}); };
  x.send(JSON.stringify(payload));
}

// ---------------------------------------------------------------- lista

function diasVencida(dataGatilho) {
  var venc = new Date(dataGatilho + "T00:00:00");
  venc.setDate(venc.getDate() + 3);
  return Math.floor((Date.now() - venc.getTime()) / 864e5);
}
function ddmm(iso) { return iso.slice(8, 10) + "/" + iso.slice(5, 7); }
// "(21) 99337-3430"; numero sem DDD fica cru com aviso (o NBS as vezes nao tem)
function fmtTel(t) {
  if (!t) return "";
  if (t.length >= 10) {
    var resto = t.slice(2);
    return "(" + t.slice(0, 2) + ") " + resto.slice(0, resto.length - 4) + "-" + resto.slice(-4);
  }
  return t + " · sem DDD";
}
function rotuloData(p) {
  return (p.tipo === "compra" ? "entrega " : "OS encerrada ") + ddmm(p.data_gatilho);
}
function servicosBonitos(d) {
  return (d.servicos || "").split(" | ").join(" · ");
}
// coluna "o que foi feito / quem atendeu"
function feitoPorQuem(p) {
  var d = p.detalhe || {};
  if (p.tipo === "compra") {
    return { feito: "Compra de veículo" + (d.proposta ? " · proposta " + d.proposta : ""),
             quem: d.vendedor ? "vendedor: " + d.vendedor : "" };
  }
  return { feito: servicosBonitos(d) + (d.os ? "  (OS " + d.os + ")" : ""),
           quem: d.consultor ? "consultor: " + d.consultor : "" };
}

function desenhaLista() {
  var lista = $("lista");
  lista.innerHTML = "";
  var pend = DADOS.pendentes;
  $("resumo").textContent = pend.length + " pendente" + (pend.length === 1 ? "" : "s");
  $("vazio").classList.toggle("hide", pend.length > 0);

  pend.forEach(function (p) {
    var d = diasVencida(p.data_gatilho);
    var fq = feitoPorQuem(p);
    var linha = document.createElement("div");
    linha.className = "linha";
    linha.innerHTML =
      '<div><span class="badge ' + p.tipo + '">' + p.tipo + "</span></div>" +
      "<div><h3></h3><div class='mini tel-slot'></div></div>" +
      "<div class='quem veic'></div>" +
      "<div><div class='quem feito'></div><div class='mini quem-linha'></div></div>" +
      "<div><div class='quem data'></div>" +
      '<div class="venc' + (d > 2 ? " atrasada" : "") + '">' +
        (d > 0 ? "venceu há " + d + "d" : "vence hoje") + "</div>" +
      "<div class='mini tent'></div></div>";
    linha.querySelector("h3").textContent = p.cliente_nome;
    if (p.telefone) linha.querySelector(".tel-slot").textContent = "📞 " + fmtTel(p.telefone);
    linha.querySelector(".veic").textContent = p.veiculo || "—";
    linha.querySelector(".feito").textContent = fq.feito;
    linha.querySelector(".quem-linha").textContent = fq.quem;
    linha.querySelector(".data").textContent = rotuloData(p);
    var nt = (p.tentativas || []).length;
    if (nt) {
      linha.querySelector(".tent").textContent =
        "📵 " + nt + (nt === 1 ? " tentativa" : " tentativas");
    }
    linha.onclick = function () { abre(p); };
    lista.appendChild(linha);
  });
  mostra("tela-lista");
}

function carrega() {
  mostra("carregando");
  api({ acao: "listar", senha: SENHA }, function (st, b) {
    if (st === 401) {
      localStorage.removeItem("pz_senha");
      $("erro-senha").textContent = SENHA ? "Senha incorreta." : "";
      $("erro-senha").className = "aviso" + (SENHA ? " erro" : "");
      SENHA = "";
      mostra("tela-senha");
      return;
    }
    if (st !== 200 || !b.ok) {
      $("erro-senha").textContent = "Erro ao carregar (" + (b.erro || st) + "). Tente de novo.";
      $("erro-senha").className = "aviso erro";
      mostra("tela-senha");
      return;
    }
    DADOS = b;
    desenhaLista();
  });
}

// ---------------------------------------------------------------- pesquisa aberta

function dd(dl, titulo, valor, html) {
  if (!valor) return;
  var dt = document.createElement("dt");
  dt.textContent = titulo;
  var el = document.createElement("dd");
  if (html) el.innerHTML = valor; else el.textContent = valor;
  dl.appendChild(dt); dl.appendChild(el);
}

function abre(p) {
  ABERTA = p;
  RESP = {};
  var d = p.detalhe || {};
  $("p-badge").innerHTML = '<span class="badge ' + p.tipo + '">' + p.tipo + "</span>";
  $("p-nome").textContent = p.cliente_nome;

  var dl = $("p-dossie");
  dl.innerHTML = "";
  if (p.telefone && p.telefone.length >= 10) {
    dd(dl, "Telefone", '<a class="tel" href="tel:+55' + p.telefone + '">📞 ' + fmtTel(p.telefone) + "</a>", true);
  } else if (p.telefone) {
    dd(dl, "Telefone", "📞 " + fmtTel(p.telefone));
  } else {
    dd(dl, "Telefone", "sem telefone no cadastro");
  }
  dd(dl, "E-mail", p.email);
  dd(dl, "Veículo", p.veiculo);
  if (p.tipo === "compra") {
    dd(dl, "Entrega", ddmm(p.data_gatilho) + (d.entregou ? " · por " + d.entregou : ""));
    dd(dl, "Vendedor", d.vendedor);
    dd(dl, "Proposta", d.proposta ? String(d.proposta) : "");
  } else {
    dd(dl, "OS", d.os ? String(d.os) : "");
    dd(dl, "Aberta em", d.abertura ? ddmm(d.abertura) : "");
    dd(dl, "Encerrada em", ddmm(p.data_gatilho));
    dd(dl, "Serviços realizados", servicosBonitos(d));
    dd(dl, "Consultor", d.consultor);
  }
  desenhaCrm();

  var box = $("perguntas");
  box.innerHTML = "";
  (DADOS.perguntas[p.tipo] || []).forEach(function (q) {
    var div = document.createElement("div");
    div.className = "q";
    var pp = document.createElement("p");
    pp.className = "p";
    pp.textContent = q.p;
    div.appendChild(pp);

    if (q.t === "nota") {
      var ops = document.createElement("div");
      ops.className = "opcoes";
      for (var n = 0; n <= 10; n++) {
        (function (n) {
          var btn = document.createElement("button");
          btn.type = "button";
          btn.textContent = n;
          btn.onclick = function () {
            RESP[q.id] = n;
            [].forEach.call(ops.children, function (c) { c.classList.remove("sel"); });
            btn.classList.add("sel");
          };
          ops.appendChild(btn);
        })(n);
      }
      div.appendChild(ops);
    } else if (q.t === "simnao") {
      var ops2 = document.createElement("div");
      ops2.className = "opcoes";
      ["SIM", "NÃO"].forEach(function (v) {
        var btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = v;
        btn.onclick = function () {
          RESP[q.id] = v;
          [].forEach.call(ops2.children, function (c) { c.classList.remove("sel"); });
          btn.classList.add("sel");
        };
        ops2.appendChild(btn);
      });
      div.appendChild(ops2);
    } else {
      var ta = document.createElement("textarea");
      ta.oninput = function () { RESP[q.id] = ta.value.trim(); };
      div.appendChild(ta);
    }
    box.appendChild(div);
  });

  $("erro-resp").className = "aviso";
  $("atendente").value = localStorage.getItem("pz_atendente") || "";
  mostra("tela-pesquisa");
  window.scrollTo(0, 0);
}

// coluna CRM: linha do tempo das tentativas (mais recente primeiro), estilo Syonet
function fmtQuando(iso) {
  var q = new Date(iso);
  return ("0" + q.getDate()).slice(-2) + "/" + ("0" + (q.getMonth() + 1)).slice(-2) +
    " " + ("0" + q.getHours()).slice(-2) + ":" + ("0" + q.getMinutes()).slice(-2);
}
function desenhaCrm() {
  var box = $("crm-timeline");
  box.innerHTML = "";
  var ts = (ABERTA.tentativas || []).slice().reverse();
  if (!ts.length) {
    box.innerHTML = '<div class="nada">Nenhuma tentativa registrada ainda.</div>';
    return;
  }
  ts.forEach(function (t) {
    var e = document.createElement("div");
    e.className = "evt";
    e.innerHTML = '<div class="quando"></div><div class="texto"></div>';
    e.querySelector(".quando").textContent = "📵 " + fmtQuando(t.em) +
      (t.atendente ? " — " + t.atendente : "");
    e.querySelector(".texto").textContent = t.obs || "não atendeu";
    box.appendChild(e);
  });
}

function respostasMontadas() {
  return (DADOS.perguntas[ABERTA.tipo] || []).map(function (q) {
    return { id: q.id, p: q.p, r: RESP[q.id] !== undefined ? RESP[q.id] : null };
  });
}

function envia(status, exigeCompleto) {
  var perguntas = DADOS.perguntas[ABERTA.tipo] || [];
  if (exigeCompleto) {
    var faltando = perguntas.filter(function (q) {
      return q.t !== "texto" && RESP[q.id] === undefined;
    });
    if (faltando.length) {
      $("erro-resp").textContent = "Falta responder: " + faltando.map(function (q) { return q.p; }).join(" · ");
      $("erro-resp").className = "aviso erro";
      return;
    }
  }
  var atendente = $("atendente").value.trim();
  if (atendente) localStorage.setItem("pz_atendente", atendente);

  ["concluir", "sem-contato", "descartar"].forEach(function (b) { $(b).disabled = true; });
  api({
    acao: "responder", senha: SENHA, id: ABERTA.id, status: status,
    respostas: status === "concluida" ? respostasMontadas() : null,
    atendente: atendente,
  }, function (st, b) {
    ["concluir", "sem-contato", "descartar"].forEach(function (x) { $(x).disabled = false; });
    if (st !== 200 || !b.ok) {
      $("erro-resp").textContent = "Não gravou (" + (b.erro || st) + "). Tente de novo.";
      $("erro-resp").className = "aviso erro";
      return;
    }
    if (status === "concluida") { mostraResultado(b); } else { carrega(); }
  });
}

// tela de confirmacao: o que ficou gravado + status do e-mail de resultado
function mostraResultado(b) {
  $("res-cliente").textContent = ABERTA.cliente_nome +
    (ABERTA.veiculo ? " · " + ABERTA.veiculo : "");
  var dl = $("res-respostas");
  dl.innerHTML = "";
  respostasMontadas().forEach(function (r) {
    dd(dl, r.p, r.r === null || r.r === "" ? "—" : String(r.r));
  });
  $("res-email").textContent = b.email === "enviado"
    ? "✉️ Resultado enviado por e-mail."
    : "⚠️ E-mail do resultado não saiu (" + b.email + ") — a resposta está gravada.";
  mostra("tela-resultado");
  window.scrollTo(0, 0);
}

// ---------------------------------------------------------------- eventos

$("f-senha").onsubmit = function (e) {
  e.preventDefault();
  SENHA = $("senha").value.trim();
  localStorage.setItem("pz_senha", SENHA);
  carrega();
};
$("recarregar").onclick = carrega;
$("voltar").onclick = carrega;   // recarrega a lista (contador de tentativas fresco)
$("res-voltar").onclick = carrega;
$("concluir").onclick = function () { envia("concluida", true); };
$("tentar").onclick = function () {
  var obs = $("crm-obs").value.trim();
  var atendente = $("atendente").value.trim();
  if (atendente) localStorage.setItem("pz_atendente", atendente);
  $("tentar").disabled = true;
  api({ acao: "tentativa", senha: SENHA, id: ABERTA.id, atendente: atendente, obs: obs },
    function (st, b) {
      $("tentar").disabled = false;
      if (st !== 200 || !b.ok) {
        $("erro-resp").textContent = "Não gravou a tentativa (" + (b.erro || st) + ").";
        $("erro-resp").className = "aviso erro";
        return;
      }
      // fica no card: a linha do tempo anda na hora, sem voltar pra lista
      ABERTA.tentativas = ABERTA.tentativas || [];
      ABERTA.tentativas.push({
        em: new Date().toISOString(),
        atendente: atendente || null,
        obs: obs || null,
      });
      $("crm-obs").value = "";
      desenhaCrm();
    });
};
$("sem-contato").onclick = function () {
  if (confirm("Marcar como SEM CONTATO? A pesquisa sai da lista e o telefone é apagado.")) {
    envia("sem_contato", false);
  }
};
$("descartar").onclick = function () {
  if (confirm("Descartar esta pesquisa? Ela sai da lista definitivamente.")) {
    envia("descartada", false);
  }
};

if (SENHA) { carrega(); } else { mostra("tela-senha"); }
</script>
