<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FAFAF8">
<title>Prospecta Raion</title>
<style>
  :root{ --bg:#FAFAF8; --txt:#1A1A1A; --dim:#6B7280; --line:#E0E0DC; --line2:#D6D6D1; --sep:#F0F0EC; --red:#E11D2E; --green:#1E8E3E;
         --erro-bg:#FDECEE; --erro-tx:#9F1239; --ok-bg:#E6F4EA; --cinza-bg:#EDEDEA; }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg)}
  body{color:var(--txt);font:17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
  .tela{max-width:430px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding:56px 16px 24px}
  .tela.com-rodape{padding-bottom:110px}
  .oculto{display:none!important}
  .kicker{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--red);font-weight:700}
  .titulo{font-size:28px;font-weight:700;line-height:1.15}
  .sub{font-size:15px;color:var(--dim)}
  label{display:block;font-size:14px;color:var(--dim);font-weight:600;margin:16px 0 6px}
  input{width:100%;height:54px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.04);
        color:var(--txt);font-size:17px;appearance:none;font-family:inherit}
  input::placeholder{color:#9CA3AF}
  input:focus{outline:2px solid var(--red);outline-offset:1px}
  .btn{width:100%;height:54px;border:0;border-radius:12px;font-size:17px;font-weight:700;cursor:pointer;font-family:inherit;
       display:flex;align-items:center;justify-content:center;gap:8px}
  .btn-red{background:var(--red);color:#fff;box-shadow:0 2px 6px rgba(225,29,46,.25)}
  .btn-green{background:var(--green);color:#fff}
  .btn-sec{background:#fff;color:var(--txt);border:1px solid var(--line2)}
  .btn[disabled]{opacity:.55}
  .aviso{margin-top:14px;padding:12px 14px;border-radius:12px;font-size:15px;background:var(--erro-bg);color:var(--erro-tx);display:flex;align-items:center;gap:10px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 3px rgba(0,0,0,.05);padding:16px;display:flex;flex-direction:column;gap:14px}
  .card.feito{opacity:.55;flex-direction:row;align-items:center;gap:12px;padding:14px 16px}
  .secao{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);font-weight:600;margin-top:8px;padding:0 2px}
  .nome{font-size:18px;font-weight:700}
  .ctx{font-size:14px;color:var(--dim)}
  .grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .desf{display:flex;flex-direction:column;gap:8px;padding-top:12px;border-top:1px solid var(--sep)}
  .desf .grid2{gap:8px}
  .desf button{height:48px;border-radius:12px;border:1px solid var(--line2);background:#fff;color:var(--txt);font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;
               display:flex;align-items:center;justify-content:center;gap:6px}
  .desf button.sim{border:1.5px solid var(--green);color:var(--green);font-weight:700}
  .extra{display:flex;flex-direction:column;gap:8px}
  .extra input{height:48px}
  .barra{height:6px;border-radius:3px;background:#E5E5E0;overflow:hidden}
  .barra > div{height:6px;background:var(--red);border-radius:3px;width:0;transition:width .3s}
  .abordar{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:#fff;
           box-shadow:0 1px 2px rgba(0,0,0,.04);cursor:pointer;margin-top:4px}
  .abordar-texto{white-space:pre-line;font-size:15px;color:var(--txt);padding:0 4px}
  .rodape{position:fixed;left:0;right:0;bottom:0;padding:12px 16px 24px;background:linear-gradient(to bottom,rgba(250,250,248,0),#FAFAF8 30%)}
  .pilulas{max-width:398px;margin:0 auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;padding:5px;border-radius:999px;background:#fff;
           border:1px solid var(--line);box-shadow:0 2px 8px rgba(0,0,0,.06)}
  .pilulas button{height:44px;border-radius:999px;border:0;background:transparent;color:var(--txt);font-size:15px;font-weight:600;font-family:inherit;cursor:pointer}
  .pilulas button.ativa{background:var(--red);color:#fff;font-weight:700}
  .tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
  .tile{display:flex;flex-direction:column;gap:4px;padding:16px 8px;border-radius:12px;background:#fff;border:1px solid var(--line);box-shadow:0 1px 2px rgba(0,0,0,.04);align-items:center}
  .tile b{font-size:30px;font-weight:700;line-height:1}
  .tile span{font-size:12px;color:var(--dim)}
  .lista-card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 3px rgba(0,0,0,.05);padding:4px 16px;display:flex;flex-direction:column}
  .lista-card h3{font-size:16px;font-weight:700;margin:0;padding:12px 0 8px;display:flex;justify-content:space-between;align-items:baseline}
  .lista-card h3 small{font-size:12px;color:var(--dim);font-weight:400}
  .linha{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--sep)}
  .pill{font-size:13px;font-weight:700;padding:5px 11px;border-radius:999px;white-space:nowrap;background:var(--cinza-bg);color:#4B5563}
  .pill.ok{background:var(--ok-bg);color:var(--green)} .pill.hoje{background:var(--erro-bg);color:var(--erro-tx)}
  .centro{text-align:center;color:var(--dim);font-size:13px}
  .vazio{text-align:center;color:var(--dim);font-size:14px;padding:24px 8px}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:#1A1A1A;color:#fff;padding:12px 18px;border-radius:12px;font-size:15px;
         box-shadow:0 4px 16px rgba(0,0,0,.2);opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
  .toast.on{opacity:1}
  svg{flex-shrink:0}
</style>
</head>
<body>

<!-- LOGIN -->
<section id="tela-login" class="tela">
  <img src="logo-prospecta.png" alt="Prospecta Raion" style="width:250px;height:auto;display:block;margin:28px auto 0">
  <div class="sub" style="margin:14px 0 20px;text-align:center">Entre com seus dados do RH</div>
  <label for="cpf">CPF</label>
  <input id="cpf" inputmode="numeric" autocomplete="off" placeholder="000.000.000-00" enterkeyhint="next" style="margin:0">
  <label for="nasc">Data de nascimento</label>
  <input id="nasc" inputmode="numeric" autocomplete="off" placeholder="dd/mm/aaaa" enterkeyhint="go" style="margin:0">
  <button class="btn btn-red" id="btnEntrar" style="margin-top:24px">Entrar</button>
  <div class="aviso oculto" id="erroLogin">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9F1239" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v4M12 16h.01"></path></svg>
    <span id="erroLoginTxt">CPF ou nascimento não conferem.</span>
  </div>
  <div style="flex-grow:1"></div>
  <div id="cardEvento" style="display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 16px;border-radius:14px;background:#fff;border:1px solid var(--line);box-shadow:0 1px 3px rgba(0,0,0,.05);text-align:center">
    <div style="font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:600">Evento ativo</div>
    <div id="eventoNome" style="font-size:20px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;line-height:1.2">…</div>
  </div>
  <div style="flex-grow:1"></div>
  <div class="centro">Dúvida? Fale com o RH da sua loja.</div>
</section>

<!-- MINHA LISTA -->
<section id="tela-lista" class="tela com-rodape oculto">
  <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:12px">
    <div style="display:flex;flex-direction:column;gap:2px;min-width:0">
      <div class="kicker">Prospecta Raion</div>
      <div style="font-size:22px;font-weight:700;line-height:1.2" id="quem"></div>
      <div class="ctx" id="ondeQuando"></div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:flex-end;flex-shrink:0">
      <div style="font-size:30px;font-weight:700;line-height:1"><span id="feitosN">0</span><span style="font-size:15px;color:var(--dim);font-weight:400">/<span id="totalN">0</span></span></div>
      <div style="font-size:12px;color:var(--dim)">feitos</div>
    </div>
  </div>
  <div class="barra" style="margin-top:12px"><div id="barra"></div></div>

  <div class="abordar" id="btnAbordar">
    <div style="display:flex;align-items:center;gap:10px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#E11D2E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v12H8l-4 4z"></path><path d="M8 9h8M8 12h5"></path></svg>
      <span style="font-size:16px;font-weight:600">Como abordar</span>
    </div>
    <svg id="setaAbordar" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg>
  </div>
  <div class="card oculto" id="roteiroBox" style="margin-top:8px"><div class="abordar-texto" id="roteiro"></div></div>

  <div id="cards" style="display:flex;flex-direction:column;gap:12px;margin-top:4px"></div>

  <div id="fimLista" class="oculto" style="margin-top:8px">
    <button class="btn btn-sec" id="btnMais">Pedir mais</button>
  </div>
  <div class="centro" id="rodapeTexto" style="margin-top:10px"></div>
</section>

<!-- MEU PLACAR -->
<section id="tela-placar" class="tela com-rodape oculto">
  <div style="display:flex;flex-direction:column;gap:2px">
    <div class="kicker">Meu placar</div>
    <div style="font-size:22px;font-weight:700;line-height:1.2" id="quem2"></div>
    <div class="ctx" id="ondeQuando2"></div>
  </div>
  <div class="tiles" id="tiles" style="margin-top:16px"></div>
  <div class="lista-card" id="cardInteresses" style="margin-top:16px">
    <h3>Seus interesses</h3>
    <div id="listaInteresses"></div>
  </div>
  <div class="lista-card oculto" id="cardRanking" style="margin-top:16px">
    <h3>Ranking da loja <small>por interesses</small></h3>
    <div id="listaRanking"></div>
  </div>
</section>

<div class="rodape oculto" id="rodape">
  <div class="pilulas">
    <button id="abaLista" class="ativa">Minha lista</button>
    <button id="abaPlacar">Meu placar</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const API = "https://winlvztcxczdgjqklxrv.supabase.co/functions/v1/prospecta";
const EVENTO = new URLSearchParams(location.search).get("e") || "";
const DESF = [["nao_atendeu","Não atendeu"],["sem_interesse","Sem interesse"],["numero_errado","Número errado"],["interesse","Tem interesse"]];
const ROTULO = Object.fromEntries(DESF);
const ICO = {
  tel: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"></path></svg>',
  zap: '<svg width="20" height="20" viewBox="0 0 24 24" fill="#fff"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.885-9.885 9.885m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>',
  ok: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1E8E3E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"></path></svg>',
  x: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6B7280" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>',
  check16: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1E8E3E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"></path></svg>'
};
let S = { token:null, col:null, ev:null, clientes:[], toque:{} };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ls = { get:(k)=>{ try{return JSON.parse(localStorage.getItem(k));}catch{return null;} }, set:(k,v)=>{ try{localStorage.setItem(k,JSON.stringify(v));}catch{} }, del:(k)=>{ try{localStorage.removeItem(k);}catch{} } };
const fmtData = (iso) => iso ? (() => { const [y,m,d] = iso.split("-"); const dias=["dom","seg","ter","qua","qui","sex","sáb"]; return `${dias[new Date(+y,+m-1,+d).getDay()]} ${d}/${m}`; })() : "";
let toastT; function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("on"),2600); }

async function api(body){
  const r = await fetch(API, {method:"POST", headers:{"content-type":"application/json"}, body:JSON.stringify({...body, evento:EVENTO, token:S.token})});
  const j = await r.json().catch(()=>({ok:false, erro:"resposta-invalida"}));
  if (r.status === 401 && body.acao !== "login" && body.acao !== "evento") sair();
  return j;
}

// ---------- login ----------
const fmtCpf = (v) => { v = v.replace(/\D/g,"").slice(0,11); return v.replace(/(\d{3})(\d)/,"$1.$2").replace(/(\d{3})(\d)/,"$1.$2").replace(/(\d{3})(\d{1,2})$/,"$1-$2"); };
const fmtNasc = (v) => { v = v.replace(/\D/g,"").slice(0,8); return v.replace(/(\d{2})(\d)/,"$1/$2").replace(/(\d{2})(\d)/,"$1/$2"); };
$("cpf").addEventListener("input", e => e.target.value = fmtCpf(e.target.value));
$("nasc").addEventListener("input", e => e.target.value = fmtNasc(e.target.value));
$("nasc").addEventListener("keydown", e => { if (e.key === "Enter") $("btnEntrar").click(); });

$("btnEntrar").onclick = async () => {
  $("erroLogin").classList.add("oculto");
  const n = $("nasc").value.replace(/\D/g,"");
  const nascISO = n.length === 8 ? `${n.slice(4,8)}-${n.slice(2,4)}-${n.slice(0,2)}` : "";
  const b = $("btnEntrar"); b.disabled = true; b.textContent = "Entrando…";
  const j = await api({acao:"login", cpf:$("cpf").value, nascimento:nascISO}).catch(()=>({ok:false, erro:"rede"}));
  b.disabled = false; b.textContent = "Entrar";
  if (!j.ok){
    $("erroLoginTxt").textContent = { "travado-15-min":"Muitas tentativas. Tente de novo em 15 minutos.", "evento-encerrado":"Este evento já encerrou.",
      "evento-nao-encontrado":"Link inválido. Peça o link certo ao seu gestor.", "rede":"Sem conexão. Tente de novo." }[j.erro] || "CPF ou nascimento não conferem.";
    $("erroLogin").classList.remove("oculto"); return;
  }
  S.token = j.token; S.col = j.colaborador; S.ev = j.evento;
  ls.set("prospecta_sessao", {token:S.token, col:S.col, ev:S.ev, evento:EVENTO});
  await abrirLista();
};

function sair(){ S = {token:null,col:null,ev:null,clientes:[],toque:{}}; ls.del("prospecta_sessao");
  ["tela-lista","tela-placar","rodape"].forEach(id => $(id).classList.add("oculto")); $("tela-login").classList.remove("oculto"); }

// ---------- lista ----------
function cabecalho(){
  const onde = [S.col.loja, S.ev.nome, fmtData(S.ev.data_evento)].filter(Boolean).join(" · ");
  $("quem").textContent = S.col.nome; $("ondeQuando").textContent = onde;
  $("quem2").textContent = S.col.nome; $("ondeQuando2").textContent = [S.ev.nome, S.col.loja].filter(Boolean).join(" · ");
  $("roteiro").textContent = S.ev.roteiro || "O roteiro deste evento ainda não foi cadastrado.";
}
async function abrirLista(){
  $("tela-login").classList.add("oculto"); $("tela-lista").classList.remove("oculto"); $("rodape").classList.remove("oculto");
  cabecalho();
  await drenarFila();
  const j = await api({acao:"fatia"}).catch(()=>null);
  if (!j || !j.ok){ toast("Não consegui buscar sua lista" + (j ? ": " + j.erro : "")); return; }
  S.clientes = j.clientes; render();
}
$("btnAbordar").onclick = () => { const b = $("roteiroBox"); b.classList.toggle("oculto"); $("setaAbordar").style.transform = b.classList.contains("oculto") ? "" : "rotate(180deg)"; };

const pendente = (c) => !c.desfecho || c.desfecho.desfecho === "nao_atendeu";

function render(){
  const pend = S.clientes.filter(pendente), feitos = S.clientes.filter(c => !pendente(c));
  $("feitosN").textContent = feitos.length; $("totalN").textContent = S.clientes.length;
  $("barra").style.width = S.clientes.length ? Math.round(feitos.length / S.clientes.length * 100) + "%" : "0%";
  const box = $("cards"); box.innerHTML = "";
  if (!S.clientes.length){ box.innerHTML = '<div class="vazio">A fila da sua loja acabou. Fale com seu gestor.</div>'; }
  if (pend.length){ const h = document.createElement("div"); h.className = "secao"; h.textContent = "Pra ligar"; box.appendChild(h); pend.forEach(c => box.appendChild(cardPendente(c))); }
  if (feitos.length){ const h = document.createElement("div"); h.className = "secao"; h.textContent = "Feitos"; box.appendChild(h); feitos.forEach(c => box.appendChild(cardFeito(c))); }
  const podeMais = S.clientes.length && pend.length === 0 && S.ev.reposicao;
  $("fimLista").classList.toggle("oculto", !podeMais);
  $("rodapeTexto").textContent = podeMais ? "Você fechou todos. Quer mais uns clientes?" : (S.clientes.length ? "Quando fechar todos, aparece o botão Pedir mais." : "");
}

function cardPendente(c){
  const el = document.createElement("div"); el.className = "card";
  const tent = c.tentativas_nao_atendeu ? `<span style="font-size:13px;color:var(--dim);font-weight:400"> ${c.tentativas_nao_atendeu}× não atendeu</span>` : "";
  el.innerHTML = `<div style="display:flex;flex-direction:column;gap:2px"><div class="nome">${esc(c.nome)}${tent}</div><div class="ctx">${esc(c.contexto || "")}</div></div>
    <div class="grid2"><button class="btn btn-red" data-canal="ligar">${ICO.tel} Ligar</button><button class="btn btn-green" data-canal="whatsapp">${ICO.zap} WhatsApp</button></div>
    <div class="desf oculto"><div style="font-size:14px;color:var(--dim);font-weight:600">Como foi?</div><div class="grid2"></div>
      <div class="extra oculto"><input class="modelo" placeholder="Modelo de interesse (opcional)"><input class="obs" placeholder="Observação (opcional)"><button class="btn btn-red salvar" style="height:48px">Salvar</button></div></div>`;
  const desf = el.querySelector(".desf"), grid = desf.querySelector(".grid2");
  if (S.toque[c.id_cliente]) mostrarDesfechos();
  function mostrarDesfechos(){
    desf.classList.remove("oculto"); grid.innerHTML = "";
    for (const [k,l] of DESF){ const b = document.createElement("button"); b.textContent = l; if (k === "interesse"){ b.className = "sim"; b.innerHTML = ICO.check16 + " " + l; }
      b.onclick = () => { if (k === "interesse"){ el.querySelector(".extra").classList.remove("oculto"); el.querySelector(".salvar").onclick = () => salvar(c, "interesse", el); el.querySelector(".modelo").focus(); } else salvar(c, k, el); };
      grid.appendChild(b); }
  }
  el.querySelectorAll("[data-canal]").forEach(b => b.onclick = async () => {
    const canal = b.dataset.canal; b.disabled = true;
    const j = await api({acao:"toque", id_cliente:c.id_cliente, canal}).catch(()=>null);
    b.disabled = false;
    if (!j || !j.ok){ toast("Não consegui registrar o contato" + (j ? ": " + j.erro : "")); return; }
    S.toque[c.id_cliente] = j.toque_id;
    mostrarDesfechos();
    if (canal === "ligar") location.href = "tel:+55" + j.telefone; else window.open(j.wa_url, "_blank");
  });
  return el;
}
function cardFeito(c){
  const el = document.createElement("div"); el.className = "card feito";
  const d = c.desfecho || {}; const ok = d.desfecho === "interesse";
  const linha = ok ? ["Tem interesse", d.modelo, "enviado pra loja à noite"].filter(Boolean).join(" · ") : (ROTULO[d.desfecho] || "");
  el.innerHTML = `${ok ? ICO.ok : ICO.x}<div style="display:flex;flex-direction:column;min-width:0"><div style="font-size:16px;font-weight:700">${esc(c.nome)}</div><div style="font-size:13px;color:var(--dim)">${esc(linha)}</div></div>`;
  return el;
}

async function salvar(c, d, el){
  const corpo = {acao:"desfecho", id_cliente:c.id_cliente, desfecho:d, toque_id:S.toque[c.id_cliente] || null,
                 modelo: el.querySelector(".modelo")?.value?.trim() || null, observacao: el.querySelector(".obs")?.value?.trim() || null};
  let j = null;
  try { j = await api(corpo); } catch { j = null; }
  if (!j){ const f = ls.get("prospecta_fila") || []; f.push(corpo); ls.set("prospecta_fila", f); toast("Sem sinal. Guardei e envio quando voltar."); }
  else if (!j.ok){ toast("Não salvou: " + j.erro); return; }
  if (j && j.devolvido){ S.clientes = S.clientes.filter(x => x.id_cliente !== c.id_cliente); toast("3 tentativas. Esse cliente volta pra fila."); }
  else { c.desfecho = {desfecho:d, modelo:corpo.modelo}; if (d === "nao_atendeu") c.tentativas_nao_atendeu = (j && j.tentativas) || (c.tentativas_nao_atendeu||0)+1; }
  if (d === "interesse") toast("Enviado pra loja hoje à noite. Valeu!");
  render();
}
async function drenarFila(){
  const fila = ls.get("prospecta_fila") || []; if (!fila.length) return;
  const resto = [];
  for (const it of fila){ const j = await api(it).catch(()=>null); if (!j) resto.push(it); }
  ls.set("prospecta_fila", resto);
}
$("btnMais").onclick = async () => { const b = $("btnMais"); b.disabled = true; const j = await api({acao:"pedir_mais"}).catch(()=>null); b.disabled = false;
  if (j && j.ok){ S.clientes = j.clientes; S.toque = {}; render(); window.scrollTo(0,0); } else toast("Não deu: " + (j ? j.erro : "sem conexão")); };

// ---------- placar ----------
const STATUS = { vendeu:["Comprou","ok"], visitou:["Visitou","ok"], agendou:["Agendou visita","ok"], na_loja:["Na loja",""], vai_hoje:["Vai hoje à noite","hoje"] };
async function abrirPlacar(){
  $("tela-lista").classList.add("oculto"); $("tela-placar").classList.remove("oculto"); window.scrollTo(0,0);
  $("abaPlacar").classList.add("ativa"); $("abaLista").classList.remove("ativa");
  const j = await api({acao:"placar"}).catch(()=>null);
  if (!j || !j.ok){ toast("Não consegui carregar o placar"); return; }
  const p = j.placar;
  $("tiles").innerHTML = [["contatos",p.toques,""],["interesses",p.interesses,"color:var(--green)"],["na loja",p.enviados,""],["visitas",p.visitas,""],["vendas",p.vendas,"color:var(--red)"],["sem interesse",p.sem_interesse,""]]
    .map(([l,v,st]) => `<div class="tile"><b style="${st}">${v}</b><span>${l}</span></div>`).join("");
  const li = $("listaInteresses");
  li.innerHTML = (j.interesses || []).length ? j.interesses.map(i => { const [tx,cl] = STATUS[i.status] || [i.status,""]; const dt = i.horario ? new Date(i.horario) : null;
      const quando = dt ? (dt.toDateString() === new Date().toDateString() ? "hoje" : `${String(dt.getDate()).padStart(2,"0")}/${String(dt.getMonth()+1).padStart(2,"0")}`) : "";
      return `<div class="linha"><div style="display:flex;flex-direction:column"><div style="font-size:16px;font-weight:600">${esc(i.nome)}</div><div style="font-size:13px;color:var(--dim)">${esc([i.modelo, quando].filter(Boolean).join(" · "))}</div></div><div class="pill ${cl}">${tx}</div></div>`; }).join("")
    : '<div class="vazio">Seus interesses aparecem aqui.</div>';
  const rk = $("cardRanking");
  if (j.ranking){ rk.classList.remove("oculto");
    $("listaRanking").innerHTML = j.ranking.top.map(r => `<div class="linha" style="font-size:16px;${r.eu ? "font-weight:700;color:var(--red)" : ""}"><div style="display:flex;gap:10px"><span style="${r.eu ? "" : "color:var(--dim)"};width:22px">${r.pos}º</span><span>${esc(r.nome)}</span></div><span style="${r.eu ? "" : "color:var(--dim)"}">${r.interesses} interesses</span></div>`).join("")
      + (j.ranking.minha_posicao > 3 ? `<div class="linha" style="font-size:16px;font-weight:700;color:var(--red)"><div style="display:flex;gap:10px"><span style="width:22px">${j.ranking.minha_posicao}º</span><span>Você</span></div><span>${j.ranking.meus} interesses</span></div>` : "");
  } else rk.classList.add("oculto");
}
function voltarLista(){ $("tela-placar").classList.add("oculto"); $("tela-lista").classList.remove("oculto"); $("abaLista").classList.add("ativa"); $("abaPlacar").classList.remove("ativa"); window.scrollTo(0,0); }
$("abaPlacar").onclick = abrirPlacar; $("abaLista").onclick = voltarLista;

// ---------- boot ----------
(async () => {
  if (!EVENTO){ $("eventoNome").textContent = "Link sem evento"; return; }
  api({acao:"evento"}).then(j => { $("eventoNome").textContent = j.ok ? j.evento.nome : (j.erro === "evento-nao-encontrado" ? "Link inválido" : "…"); if (j.ok && !j.evento.ativo) $("eventoNome").textContent += " (encerrado)"; }).catch(()=>{ $("eventoNome").textContent = "…"; });
  const s = ls.get("prospecta_sessao");
  if (s && s.evento === EVENTO && s.token){ S.token = s.token; S.col = s.col; S.ev = s.ev; await abrirLista(); }
})();
</script>
